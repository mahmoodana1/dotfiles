# Keep Bluetooth headsets in A2DP (hi-fi). Otherwise any app that opens the
# mic flips them to HFP: mono, tinny, and a dropout on every switch.
# Pick the headset profile manually (pavucontrol) when you want the Buds mic.
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}

monitor.bluez.properties = {
  # AAC first: steadier than SBC-XQ on the shared-antenna RTL8821CE
  bluez5.codecs = [ aac sbc_xq sbc ]
}
