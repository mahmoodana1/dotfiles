# --- Basic Usage ---
set -g mouse on               # Allows scrolling and clicking
set -g default-terminal "tmux-256color" # Ensures colors look correct
set -as terminal-features ",alacritty:RGB"   # truecolor inside alacritty
set -as terminal-features ",xterm-256color:RGB"
setenv -g COLORTERM truecolor                 # apps like starship check this
setenv -g FORCE_COLOR 3                       # Node/chalk CLIs (Claude Code) — force truecolor
set -ga update-environment "COLORTERM"
set -ga update-environment "FORCE_COLOR"

# Let apps talk directly to the outer terminal (DCS passthrough). dojo uses
# this to draw real images with the kitty graphics protocol.
set -g allow-passthrough on

# --- Sane defaults ---
# Default is 500ms, which tmux spends waiting to see if an ESC is the start of
# an escape sequence — that is the lag on every ESC in nvim.
set -sg escape-time 10
# Let nvim see focus gained/lost (autoread, autosave-on-leave).
set -g focus-events on
# 2000 lines is tiny, and it is also all that resurrect can save per pane.
set -g history-limit 50000
# OSC 52, so yanking works over ssh (phone-lan/phone-arch) where wl-copy can't.
set -g set-clipboard on
# Windows/panes start at 1 — 0 is a long reach on the number row.
set -g base-index 1
setw -g pane-base-index 1
# Close window 2 of 1,2,3 and you get 1,2 instead of a gap at 2.
set -g renumber-windows on
# Killing a session drops you into another one instead of back to the shell.
set -g detach-on-destroy off
# -- Bind a as Command Key --

unbind C-b                  # Remove the old Ctrl+b binding
set -g prefix C-a           # Set the new binding to Ctrl+a
bind C-a send-prefix        # Allows pressing Ctrl+a twice to send it to an app inside tmux

# --- Vim-style pane navigation ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- lens: reopen the panel of Claude's edits (it pops up on its own when Claude finishes) ---
bind e run-shell "TMUX_PANE=#{pane_id} ~/.local/bin/lens popup"
bind E run-shell "cd '#{pane_current_path}' && ~/.local/bin/lens auto toggle"

# --- Vim-style copy mode (v to select, V for line, y to yank to system clipboard) ---
setw -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
# Mouse drag also pipes to system clipboard on release
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"
# --- The Colors ---
# bg = Background (Dark Purple)
# fg = Foreground (White Text)
set -g status-style "bg=#1d2031,fg=white"

# TPM
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# --- Session persistence across reboots ---
# resurrect saves the layout; continuum runs the save on a timer and restores
# it the moment the tmux server starts again.

# Save every pane's scrollback too, not just the layout.
set -g @resurrect-capture-pane-contents 'on'

# Which programs get relaunched. The default whitelist is
# `vi vim nvim emacs man less more tail top htop irssi weechat mutt`;
# everything below is *added* to it.
#   ~foo          -> match "foo" anywhere in the saved command line
#   ->bar         -> run "bar" instead when restoring
# claude is relaunched with --continue so the pane comes back on the same
# conversation instead of a blank one. Restores run through send-keys into the
# pane's interactive zsh, so the claude() wrapper in .zshrc still applies.
set -g @resurrect-processes '"~claude->claude --continue" ssh btop lazygit yazi lazydocker'

# Snapshot every 2 min, restore automatically on server start.
set -g @continuum-restore 'on'
set -g @continuum-save-interval '2'

# Never snapshot the dojo session (SUPER+L owns it). Restored, it comes back as
# a bare zsh showing a dead screenshot of dojo, and `new-session -A` attaches
# to that instead of launching dojo. The hook gets the snapshot path as $1.
set -g @resurrect-hook-post-save-layout "sed -i -E '/^(pane|window|grouped_session)[[:space:]]dojo[[:space:]]/d'"
# Lets launch-dojo.sh wait for continuum's restore before attaching (restore
# switch-clients through every session, which would yank the dojo window).
set -g @resurrect-hook-post-restore-all "tmux set -g @restore-done 1"

# A 2-min interval writes ~720 snapshot files a day; keep the newest 20.
set -g @resurrect-hook-post-save-all 'ls -1t ~/.local/share/tmux/resurrect/tmux_resurrect_*.txt 2>/dev/null | tail -n +21 | xargs -r rm -f'

# Initialize TPM (keep at very bottom)
run '~/.tmux/plugins/tpm/tpm'
