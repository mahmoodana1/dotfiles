# Idle behaviour (hypridle). Timeouts are in seconds.

general {
    lock_cmd = pidof hyprlock || hyprlock       # what `loginctl lock-session` runs
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    ignore_dbus_inhibit = false                 # let firefox/steam/etc. block idle
}

# 9 min: heads-up
listener {
    timeout = 540
    on-timeout = notify-send -u low -i dialog-information "You are idle"
    on-resume = notify-send -u low -i dialog-information "Welcome back"
}

# 30 min: lock
listener {
    timeout = 1800
    on-timeout = loginctl lock-session
}
