# keyd: hold Tab for a navigation layer.
#   tap Tab            -> Tab (sent when you let go)
#   hold Tab + h/j/k/l -> Left/Down/Up/Right
# Shift passes through, so Shift+Tab+h selects left; Ctrl+Tab, Alt+Tab and
# SUPER+Tab fire on press (browser tabs / windows / workspaces).
#
# Install (root):  sudo install -Dm644 ~/dotfiles/system/etc/keyd/default.conf /etc/keyd/default.conf
#                  sudo systemctl enable --now keyd
# After editing:   sudo keyd reload
# Panic exit if a config ever locks the keyboard: Backspace+Escape+Enter.

[ids]
*

[main]
tab = overload(nav, tab)
# Caps Lock is Ctrl (Hyprland's ctrl:nocaps happens after keyd, so keyd must do
# it itself or Caps+Tab would never reach the [control] layer below).
capslock = layer(control)

# With Alt or Super held, Tab fires on press (no tap/hold wait), so
# Alt+Tab, SUPER+Tab and Ctrl+Tab switch instantly. Shift alone keeps the nav layer.
# keyd drops a layer's modifiers before emitting, so each binding re-adds them.
[control]
tab = C-tab

[control+shift]
tab = C-S-tab

[alt]
tab = A-tab

[alt+shift]
tab = A-S-tab

[meta]
tab = M-tab

[meta+shift]
tab = M-S-tab

[control+meta]
tab = C-M-tab

[control+meta+shift]
tab = C-M-S-tab

[alt+meta]
tab = A-M-tab

[alt+meta+shift]
tab = A-M-S-tab

[nav]
h = left
j = down
k = up
l = right
