# ─────────────────────────────────────────────────────────────────────
#  THE color palette. Every app's colors come from this one file.
#
#  Edit a value, then run:   palette-apply
#  (re-renders every file in templates/ and reloads hypr / waybar)
#
#  Values: #RRGGBB, or the name of another entry (e.g.  accent = color13)
# ─────────────────────────────────────────────────────────────────────

background = #00010E
foreground = #E1E4E9
cursor     = #7A9CB2

# 16 base colors (terminal order: 0-7 normal, 8-15 bright)
color0  = #000511
color1  = #0C3B57
color2  = #0E3F5C
color3  = #464443
color4  = #55463D
color5  = #4B6477
color6  = #7F858F
color7  = #CCD0D7
color8  = #8F9196
color9  = #104E74
color10 = #13547B
color11 = #5E5A59
color12 = #715D52
color13 = #64859F
color14 = #AAB1BF
color15 = #CCD0D7

# ── Roles ── point these at any color above to restyle things at once.
accent          = color13
border_active   = color15
border_inactive = color10
