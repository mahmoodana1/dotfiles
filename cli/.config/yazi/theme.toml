# GENERATED by ~/.config/yazi/gen-theme.py from nvim's Catppuccin palette.
# Edit the generator (or nvim's ui.lua and re-run it), not this file.

[mgr]
cwd = { fg = "#8db6fd", bold = true }
find_keyword  = { fg = "#cdd6f4", bg = "#465f73", bold = true }
find_position = { fg = "#9399b2", italic = true }
symlink_target = { fg = "#9399b2", italic = true }

marker_symbol   = "▎"
marker_copied   = { fg = "#a5e4a8" }
marker_cut      = { fg = "#f090b2" }
marker_marked   = { fg = "#96e4de" }
marker_selected = { fg = "#c7a4fa" }

count_copied   = { fg = "#28283d", bg = "#a5e4a8" }
count_cut      = { fg = "#28283d", bg = "#f090b2" }
count_selected = { fg = "#28283d", bg = "#c7a4fa" }

border_symbol = "│"
border_style  = { fg = "#505268" }

# Hovered row = nvim CursorLine, with lualine's rounded ends.
[indicator]
current = { bg = "#35354b", bold = true }
parent  = { bg = "#35354b" }
preview = { bg = "#35354b" }
padding = { open = "", close = "" }

[tabs]
active    = { fg = "#222234", bg = "#8db6fd", bold = true }
inactive  = { fg = "#8db6fd", bg = "#3c3d53" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

# Modes = lualine catppuccin-mocha: normal blue, select = visual mauve.
[mode]
normal_main = { fg = "#222234", bg = "#8db6fd", bold = true }
normal_alt  = { fg = "#8db6fd", bg = "#3c3d53" }
select_main = { fg = "#28283d", bg = "#c7a4fa", bold = true }
select_alt  = { fg = "#c7a4fa", bg = "#3c3d53" }
unset_main  = { fg = "#28283d", bg = "#f090b2", bold = true }
unset_alt   = { fg = "#f090b2", bg = "#3c3d53" }

[status]
overall   = { fg = "#a6adc8" }
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_sep   = { fg = "#505268" }
perm_type  = { fg = "#8db6fd" }
perm_read  = { fg = "#f3deb1" }
perm_write = { fg = "#f090b2" }
perm_exec  = { fg = "#a5e4a8" }
progress_label  = { fg = "#cdd6f4", bold = true }
progress_normal = { fg = "#8db6fd", bg = "#3c3d53" }
progress_error  = { fg = "#f090b2", bg = "#3c3d53" }

# Popups = nvim floats (mantle background, blue FloatBorder); the key list
# = which-key (keys blue, descriptions pink).
[which]
mask            = { bg = "#222234" }
cand            = { fg = "#8db6fd", bold = true }
rest            = { fg = "#7f849c" }
desc            = { fg = "#efbae8" }
separator       = "  "
separator_style = { fg = "#505268" }

[confirm]
border  = { fg = "#8db6fd" }
title   = { fg = "#a6adc8" }
btn_yes = { fg = "#222234", bg = "#8db6fd", bold = true }
btn_no  = { fg = "#9399b2" }

[spot]
border   = { fg = "#8db6fd" }
title    = { fg = "#a6adc8" }
tbl_col  = { fg = "#8db6fd" }
tbl_cell = { fg = "#cdd6f4", bg = "#505268" }

[notify]
title_info  = { fg = "#96e4de" }
title_warn  = { fg = "#f3deb1" }
title_error = { fg = "#f090b2" }

[pick]
border   = { fg = "#8db6fd" }
active   = { fg = "#cdd6f4", bg = "#3c3d53", bold = true }
inactive = { fg = "#9399b2" }

[input]
border   = { fg = "#8db6fd" }
title    = { fg = "#a6adc8" }
value    = { fg = "#cdd6f4" }
selected = { bg = "#505268" }

[cmp]
border   = { fg = "#8db6fd" }
active   = { fg = "#cdd6f4", bg = "#3c3d53" }
inactive = { fg = "#9399b2" }

[tasks]
border  = { fg = "#8db6fd" }
title   = { fg = "#a6adc8" }
hovered = { fg = "#cdd6f4", bg = "#3c3d53", bold = true }

[help]
border  = { fg = "#8db6fd" }
chord   = { fg = "#8db6fd", bold = true }
action  = { fg = "#efbae8" }
hovered = { bg = "#3c3d53", bold = true }

# Git = gitsigns: the same ▎ bar, green added / yellow changed / red deleted.
[git]
modified  = { fg = "#f3deb1" }
unstaged  = { fg = "#f3deb1" }
updated   = { fg = "#f3deb1" }
staged    = { fg = "#a5e4a8" }
added     = { fg = "#a5e4a8" }
untracked = { fg = "#96e4de" }
deleted   = { fg = "#f090b2" }
ignored   = { fg = "#505268" }
unstaged_sign  = "▎"
updated_sign   = "▎"
staged_sign    = "▎"
added_sign     = "▎"
untracked_sign = "▎"
deleted_sign   = "▁"
ignored_sign   = " "
clean_sign     = " "

# Folder icons in nvim's Directory blue (named ones like Downloads keep
# yazi's own icon).
[icon]
prepend_conds = [
	{ if = "dir & hovered", text = "\uf07c", fg = "#8db6fd" },
	{ if = "dir", text = "\uf07b", fg = "#8db6fd" },
]

# Folders = nvim Directory (blue), files = Normal text, dotfiles = Comment.
[filetype]
rules = [
	{ mime = "vfs/{absent,stale}", fg = "#505268" },
	{ url = "*", is = "orphan", fg = "#f090b2", italic = true },
	{ url = "*", is = "dummy", fg = "#f090b2" },
	{ url = ".*/", fg = "#9399b2" },
	{ url = "*/", fg = "#8db6fd" },
	{ url = ".*", fg = "#9399b2" },
	{ url = "*", is = "exec", fg = "#a5e4a8" },
	{ url = "*", fg = "#cdd6f4" },
]
