#
# $XDG_CONFIG_HOME/psd/psd.conf
#

# 1. ENABLE OVERLAYFS (Crucial for Speed)
# This uses less RAM and syncs faster than a full copy.
# Your kernel likely supports this (Arch standard kernel does).
USE_OVERLAYFS="yes"

# 2. ENABLE SUSPEND SYNC
# Good for data safety if you sleep/suspend your laptop often.
USE_SUSPSYNC="yes"

# 3. DEFINE BROWSERS
# Zen is not natively supported in older PSD versions, but 'zen-browser' 
# is the likely identifier if you are on the latest git version.
# If this doesn't work, PSD will just ignore it.
BROWSERS=(zen-browser)

# KEEP CRASH RECOVERY ENABLED
USE_BACKUPS="yes"
BACKUP_LIMIT=5
