# Styled to match ~/.config/alacritty/alacritty.toml (foot only runs yazi,
# for its image previews; alacritty has no graphics protocol).
[main]
term=xterm-256color
# Nerd Font variant of alacritty's JetBrains Mono, for yazi's icons.
font=JetBrainsMono Nerd Font:size=12
pad=0x0
initial-window-mode=windowed
workers=0

[scrollback]
lines=10000
multiplier=7.0

[cursor]
style=block
blink=no

[colors-dark]
alpha=0.95
background=1e1e2e
foreground=cdd6f4
cursor=1e1e2e f5e0dc
selection-background=f5e0dc
selection-foreground=1e1e2e
regular0=45475a
regular1=f38ba8
regular2=a6e3a1
regular3=f9e2af
regular4=89b4fa
regular5=cba6f7
regular6=94e2d5
regular7=bac2de
bright0=585b70
bright1=f38ba8
bright2=a6e3a1
bright3=f9e2af
bright4=89b4fa
bright5=cba6f7
bright6=94e2d5
bright7=a6adc8

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return
# Same as alacritty: Ctrl+Backspace sends ^W, Shift+Space sends CSI u.
\x17=Control+BackSpace
\x1b[32;2u=Shift+space
